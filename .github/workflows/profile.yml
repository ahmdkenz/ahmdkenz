name: Update Profile Stats

on:
  schedule:
    - cron: "0 17 * * *"   # 00:00 WIB setiap hari
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  # 1) Ringkasan lengkap (kalender setahun, bahasa, baris kode)
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ahmdkenz
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_lines: yes

  # 2) Kartu stats + top languages (pengganti instance Vercel) dan kalender 3D
  cards-and-3d:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # ambil main terbaru, termasuk commit metrics dari job sebelumnya

      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=ahmdkenz&show_icons=true&hide_border=true&theme=tokyonight&count_private=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=ahmdkenz&layout=compact&hide_border=true&theme=tokyonight&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ahmdkenz

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-3d-contrib
          if git commit -m "chore: update profile cards & 3D contribution"; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  # 3) Animasi snake (disimpan di branch "output")
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ahmdkenz
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
